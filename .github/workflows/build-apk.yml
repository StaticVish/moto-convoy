name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android Mock APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Domain TDD Unit Tests
        run: ./gradlew :core-domain:test --no-daemon

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK Artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/moto-convoy-v1.0.0.apk

      - name: Upload Mock APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moto-convoy-v1.0.0-apk
          path: artifacts/moto-convoy-v1.0.0.apk
          retention-days: 30
